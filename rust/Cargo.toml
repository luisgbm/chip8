[package]
name = "chip8"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "CHIP-8 interpreter with an SDL2 front end, ported from the JavaScript version"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
sdl2 = "0.38"

[dev-dependencies.image]
version = "0.25"
default-features = false
features = ["png"]

[profile.dev]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
